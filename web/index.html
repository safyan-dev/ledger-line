<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Ledgerline — a payment reconciliation workspace for business operations and finance teams."
    />
    <title>Ledgerline · Payment reconciliation</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f7fb;
        color: #1b2437;
        font-family: "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #boot {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .boot-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }

      .boot-copy {
        display: grid;
        gap: 3px;
      }

      .boot-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .boot-subtitle {
        color: #6b7280;
        font-size: 11px;
      }

      .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #dfe3ee;
        border-top-color: #4f46e5;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-mark">L</div>
        <div class="boot-copy">
          <span class="boot-title">Ledgerline</span>
          <span class="boot-subtitle">Loading payment operations…</span>
        </div>
        <span class="boot-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Add content security policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#474CE1" />
    <meta
      name="description"
      content="Ledgerline — a payment reconciliation workspace for business operations and finance teams."
    />
    <title>Ledgerline · Payment reconciliation</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f7fb;
        color: #1b2437;
        font-family: "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #boot {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .boot-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 10px;
        background: #474ce1;
        color: #fff;
      }

      .boot-mark svg {
        width: 26px;
        height: 26px;
      }

      .boot-copy {
        display: grid;
        gap: 3px;
      }

      .boot-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .boot-subtitle {
        color: #6b7280;
        font-size: 11px;
      }

      .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #dfe3ee;
        border-top-color: #474ce1;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <g fill="none" stroke="#fff" stroke-linecap="round">
              <path d="M11.9 8.8V21" stroke-width="3" />
              <path d="M11.9 21h11.4" stroke-width="3" />
              <path d="M17.3 12.3h4.6" stroke-width="2.4" />
              <path d="M17.3 16.9h2.4" stroke-width="2.4" />
            </g>
          </svg>
        </div>
        <div class="boot-copy">
          <span class="boot-title">Ledgerline</span>
          <span class="boot-subtitle">Loading payment operations…</span>
        </div>
        <span class="boot-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

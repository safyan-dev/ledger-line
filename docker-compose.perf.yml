services:
  postgres-perf:
    image: postgres:17-alpine
    container_name: ledgerline-postgres-perf
    environment:
      POSTGRES_DB: payment_reconciliation_perf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - perf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_reconciliation_perf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  perf-postgres-data:

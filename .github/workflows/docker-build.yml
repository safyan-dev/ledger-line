name: Docker build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      push:
        description: Push the built images to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build images and validate compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.perf.yml config --quiet
          echo "Compose configuration is valid."

      - name: Resolve image coordinates
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sha="${GITHUB_SHA}"
          registry="ghcr.io/${owner}"

          api_tags="${registry}/ledgerline-api:${sha}"
          web_tags="${registry}/ledgerline-web:${sha}"
          migrate_tags="${registry}/ledgerline-migrate:${sha}"

          if [ "${{ inputs.push }}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            api_tags="${api_tags},${registry}/ledgerline-api:latest"
            web_tags="${web_tags},${registry}/ledgerline-web:latest"
          fi

          {
            echo "api_tags=${api_tags}"
            echo "web_tags=${web_tags}"
            echo "migrate_tags=${migrate_tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: migrate
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.migrate_tags }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.web_tags }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

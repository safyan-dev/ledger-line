name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Report missing frontend test suite
        run: |
          echo "::warning title=No frontend tests::The web project has no test suite or test script configured. Only lint, typecheck and build are enforced. Add a runner (for example Vitest) to close this gap."
          {
            echo "### Frontend tests"
            echo ""
            echo "⚠️ No frontend test suite is configured; lint, typecheck and build are enforced instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
